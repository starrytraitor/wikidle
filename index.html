
<!doctype html>
<html>
  <head>
    <!-- Page setup -->
    <meta charset="utf-8">
    <title>wikidle</title>
    <meta name="description" content="Wikipedia Wordle: determine an article's subject by guessing words and making connections.">
    <meta name="author" content="Samhain Ackerman, Henry Leap, Ethan Rigor, Sophia Zhang">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>


    <!-- Custom styles -->
    <link href="style.css" rel="stylesheet" type="text/css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>


  </head>

  <body>

    <header id="header">
      <h1>
        <img src="Wikipedia-logo-v2.svg" height="100">
        <span style="font-size: 100px; padding-left: 30px">WIKIDLE</span>
      </h1>
      <p>Uncover the subject of a random Wikipedia article, one key word at a time.</p>
    </header>

    <div id="container">
      <div class="inner">
        <div id="content">

          <div id="home" class="content-region hide">
            <p>
                <form id="guessForm">
                    <label for="guessInput">Enter your guess:</label>
                    <input id="guessInput" type="text" name="lname">
                    <input id="submitButton" type="submit" value="ENTER">
                    <div id="guessList"></div>
                </form>

                <div id="article">
                  <div id="articleContents">
                      contents
                  </div>
                </div>

                <div id="winPopup">
                </div>

            </p>
          </div>


        </div>
      </div>
    </div>

    <script type="text/javascript" src="script.js"></script>
    <script type="text/javascript" src="articleList.js"></script>
    <script type="text/javascript" src="findInArticle.js"></script>
    <script type="text/javascript" src="getArticle.js"></script>
    <script type="text/javascript" src="guessForm.js"></script>
    <script type="text/javascript" src="parseWikitext.js"></script>
    <script type="text/javascript" src="blackout.js"></script>
    <script type="text/javascript" src="createWinPopup.js"></script>
    <script type="text/javascript" src="guessList.js"></script>

  </body>
</html>
